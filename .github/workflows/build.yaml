# Linux build from the Kobo VNC compilation instructions:
# Linaro gcc 4.9.4 arm-linux-gnueabihf, Ubuntu 24.04 armhf libraries,
# then `cargo build --target armv7-unknown-linux-gnueabihf`.
# releases.linaro.org no longer serves the toolchain; the download below is that same tarball.
name: Build Linux
on: [push, pull_request, workflow_dispatch]

jobs:
  build_gnueabihf:
    name: einkvnc-gnueabihf
    runs-on: ubuntu-24.04
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install stable toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: armv7-unknown-linux-gnueabihf

    - name: Install Linaro armhf sysroot
      run: |
        # The sysroot (glibc 2.19) is what the binary links against.
        # Compiling MuPDF still needs a newer g++, installed in the next step:
        # Linaro gcc 4.9 rejects MuPDF 1.27's bundled HarfBuzz.
        curl -fL --retry 5 --retry-all-errors -o /tmp/gcc-linaro-armhf.tar.xz \
          https://mirrors.dotsrc.org/armbian-dl/_toolchain/gcc-linaro-4.9.4-2017.01-x86_64_arm-linux-gnueabihf.tar.xz
        sudo tar -C /opt -xJf /tmp/gcc-linaro-armhf.tar.xz
        test -f /opt/gcc-linaro-4.9.4-2017.01-x86_64_arm-linux-gnueabihf/arm-linux-gnueabihf/libc/usr/include/stdio.h

    - name: Enable armhf packages
      run: |
        sudo dpkg --add-architecture armhf
        sudo tee /etc/apt/sources.list.d/ubuntu.sources >/dev/null << 'EOF'
        Types: deb
        URIs: http://archive.ubuntu.com/ubuntu/
        Suites: noble noble-updates noble-backports
        Components: main universe restricted multiverse
        Architectures: amd64
        Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg

        Types: deb
        URIs: http://security.ubuntu.com/ubuntu/
        Suites: noble-security
        Components: main universe restricted multiverse
        Architectures: amd64
        Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg

        Types: deb
        URIs: http://ports.ubuntu.com/ubuntu-ports/
        Suites: noble noble-updates noble-backports noble-security
        Components: main restricted universe multiverse
        Architectures: armhf
        Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg
        EOF
        sudo apt-get update

    - name: Install armhf libraries
      run: |
        # noble names the JBIG2 development package libjbig2dec0-dev.
        sudo apt-get install -y \
          gcc-arm-linux-gnueabihf \
          g++-arm-linux-gnueabihf \
          lzip \
          libz-dev:armhf \
          libbz2-dev:armhf \
          libjpeg-dev:armhf \
          libpng-dev:armhf \
          libgumbo-dev:armhf \
          libopenjp2-7-dev:armhf \
          libjbig2dec0-dev:armhf
        sysroot=/opt/gcc-linaro-4.9.4-2017.01-x86_64_arm-linux-gnueabihf/arm-linux-gnueabihf/libc/lib
        cd /usr/lib/arm-linux-gnueabihf
        shopt -s nullglob
        files=(libz.* libbz2.* libjpeg.* libpng16.* libgumbo.* libopenjp2.* libjbig2dec.*)
        test "${#files[@]}" -gt 0
        # The toolchain tree under /opt is owned by root.
        sudo cp -a "${files[@]}" "$sysroot/"

    - name: Install the sysroot compiler wrapper
      run: |
        # Named arm-linux-gnueabihf-gcc so MuPDF's --host probe and cargo share it.
        # It calls Ubuntu's gcc 13 with --sysroot set to the Linaro libc.
        bindir=/opt/einkvnc-armhf/bin
        sudo mkdir -p "$bindir"
        sudo cp client/scripts/linaro-armhf-gcc "$bindir/arm-linux-gnueabihf-gcc"
        sudo cp client/scripts/linaro-armhf-gcc "$bindir/arm-linux-gnueabihf-g++"
        sudo chmod 755 "$bindir/arm-linux-gnueabihf-gcc" "$bindir/arm-linux-gnueabihf-g++"
        for tool in ar nm ranlib ld; do
          sudo ln -sfn "/usr/bin/arm-linux-gnueabihf-$tool" "$bindir/arm-linux-gnueabihf-$tool"
        done
        echo "$bindir" >> "$GITHUB_PATH"
        cat >> client/.cargo/config.toml << EOF

        [target.armv7-unknown-linux-gnueabihf]
        linker = "$bindir/arm-linux-gnueabihf-gcc"
        EOF

    - name: Build static MuPDF and FreeType
      env:
        TOOL_PREFIX: arm-linux-gnueabihf
      run: bash client/scripts/build-kobo-libs.sh

    - name: Build
      working-directory: client
      env:
        CARGO_TARGET_ARMV7_UNKNOWN_LINUX_GNUEABIHF_LINKER: /opt/einkvnc-armhf/bin/arm-linux-gnueabihf-gcc
      run: cargo build --target armv7-unknown-linux-gnueabihf

    - name: Upload binary
      uses: actions/upload-artifact@v4
      with:
        name: eInkVnc-gnueabihf
        path: client/target/armv7-unknown-linux-gnueabihf/debug/einkvnc
