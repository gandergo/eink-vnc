# Linux build from the Kobo VNC compilation instructions:
# Linaro gcc 4.9.4 arm-linux-gnueabihf, Ubuntu 24.04 armhf libraries,
# then `cargo build --target armv7-unknown-linux-gnueabihf`.
# releases.linaro.org no longer serves the toolchain; the download below is that same tarball.
name: Build Linux
on: [push, pull_request, workflow_dispatch]

jobs:
  build_gnueabihf:
    name: einkvnc-gnueabihf
    runs-on: ubuntu-24.04
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install stable toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: armv7-unknown-linux-gnueabihf

    - name: Install Linaro armhf compiler
      run: |
        curl -fL --retry 5 --retry-all-errors -o /tmp/gcc-linaro-armhf.tar.xz \
          https://mirrors.dotsrc.org/armbian-dl/_toolchain/gcc-linaro-4.9.4-2017.01-x86_64_arm-linux-gnueabihf.tar.xz
        sudo tar -C /opt -xJf /tmp/gcc-linaro-armhf.tar.xz
        echo /opt/gcc-linaro-4.9.4-2017.01-x86_64_arm-linux-gnueabihf/bin >> "$GITHUB_PATH"
        linker=/opt/gcc-linaro-4.9.4-2017.01-x86_64_arm-linux-gnueabihf/bin/arm-linux-gnueabihf-gcc
        test -x "$linker"
        cat >> client/.cargo/config.toml << EOF

        [target.armv7-unknown-linux-gnueabihf]
        linker = "$linker"
        EOF

    - name: Enable armhf packages
      run: |
        sudo dpkg --add-architecture armhf
        sudo tee /etc/apt/sources.list.d/ubuntu.sources >/dev/null << 'EOF'
        Types: deb
        URIs: http://archive.ubuntu.com/ubuntu/
        Suites: noble noble-updates noble-backports
        Components: main universe restricted multiverse
        Architectures: amd64
        Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg

        Types: deb
        URIs: http://security.ubuntu.com/ubuntu/
        Suites: noble-security
        Components: main universe restricted multiverse
        Architectures: amd64
        Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg

        Types: deb
        URIs: http://ports.ubuntu.com/ubuntu-ports/
        Suites: noble noble-updates noble-backports noble-security
        Components: main restricted universe multiverse
        Architectures: armhf
        Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg
        EOF
        sudo apt-get update

    - name: Install armhf libraries
      run: |
        # noble names the JBIG2 development package libjbig2dec0-dev.
        sudo apt-get install -y \
          libz-dev:armhf \
          libbz2-dev:armhf \
          libjpeg-dev:armhf \
          libpng-dev:armhf \
          libgumbo-dev:armhf \
          libopenjp2-7-dev:armhf \
          libjbig2dec0-dev:armhf
        sysroot=/opt/gcc-linaro-4.9.4-2017.01-x86_64_arm-linux-gnueabihf/arm-linux-gnueabihf/libc/lib
        cd /usr/lib/arm-linux-gnueabihf
        shopt -s nullglob
        files=(libz.* libbz2.* libjpeg.* libpng16.* libgumbo.* libopenjp2.* libjbig2dec.*)
        test "${#files[@]}" -gt 0
        # The toolchain tree under /opt is owned by root.
        sudo cp -a "${files[@]}" "$sysroot/"

    - name: Build
      working-directory: client
      env:
        CARGO_TARGET_ARMV7_UNKNOWN_LINUX_GNUEABIHF_LINKER: /opt/gcc-linaro-4.9.4-2017.01-x86_64_arm-linux-gnueabihf/bin/arm-linux-gnueabihf-gcc
      run: cargo build --target armv7-unknown-linux-gnueabihf

    - name: Upload binary
      uses: actions/upload-artifact@v4
      with:
        name: eInkVnc-gnueabihf
        path: client/target/armv7-unknown-linux-gnueabihf/debug/einkvnc
