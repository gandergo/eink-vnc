name: Build
on: [push, pull_request, workflow_dispatch]

jobs:
  build_fbink:
    name: einkvnc
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: recursive

    # cross + ewpratten/kobo-cross-armhf cannot build this tree: that image
    # ships Rust 1.59 and has no FreeType, HarfBuzz, or MuPDF.
    - name: Install stable toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: arm-unknown-linux-musleabihf

    - name: Install host build tools
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential curl ca-certificates python3

    - name: Install musl cross compiler
      run: |
        curl -L --retry 3 -o /tmp/arm-linux-musleabihf-cross.tgz https://musl.cc/arm-linux-musleabihf-cross.tgz
        sudo tar -C /opt -xzf /tmp/arm-linux-musleabihf-cross.tgz
        echo /opt/arm-linux-musleabihf-cross/bin >> "$GITHUB_PATH"

    - name: Build static MuPDF and FreeType
      run: bash client/scripts/build-kobo-libs.sh

    - name: Build
      working-directory: client
      env:
        CARGO_TARGET_ARM_UNKNOWN_LINUX_MUSLEABIHF_LINKER: arm-linux-musleabihf-gcc
        CARGO_TARGET_ARM_UNKNOWN_LINUX_MUSLEABIHF_RUSTFLAGS: -C target-feature=+crt-static
      run: cargo build --release --target=arm-unknown-linux-musleabihf

    - name: Upload release archive
      uses: actions/upload-artifact@v4
      with:
        name: eInkVnc
        path: client/target/arm-unknown-linux-musleabihf/release/einkvnc
