name: Build
on: [push, pull_request, workflow_dispatch]

jobs:
  build_fbink:
    name: einkvnc
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install stable toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: arm-unknown-linux-musleabihf

    # musl.cc does not accept connections from GitHub-hosted runners.
    # This asset is the same tarball (sha256 below, 102391022 bytes).
    - name: Install musl cross compiler
      run: |
        curl -fL --retry 5 --retry-all-errors -o /tmp/arm-linux-musleabihf-cross.tgz \
          https://github.com/musl-cc/musl.cc/releases/download/v0.0.1/arm-linux-musleabihf-cross.tgz
        echo "11e155a090789c854afb5d91e57c81f441ccdb92f7f277789c3a6d5884a68e58  /tmp/arm-linux-musleabihf-cross.tgz" | sha256sum -c -
        sudo tar -C /opt -xzf /tmp/arm-linux-musleabihf-cross.tgz
        echo /opt/arm-linux-musleabihf-cross/bin >> "$GITHUB_PATH"

    # bash, not ./script: a checkout can store the script without the executable bit.
    - name: Build static FreeType
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential
        TOOL_PREFIX=arm-linux-musleabihf bash ./client/scripts/build-freetype.sh

    - name: Build
      working-directory: client
      env:
        CARGO_TARGET_ARM_UNKNOWN_LINUX_MUSLEABIHF_LINKER: arm-linux-musleabihf-gcc
        CARGO_TARGET_ARM_UNKNOWN_LINUX_MUSLEABIHF_RUSTFLAGS: -C target-feature=+crt-static
      run: cargo build --release --target=arm-unknown-linux-musleabihf

    - name: Upload release archive
      uses: actions/upload-artifact@v4
      with:
        name: eInkVnc
        path: client/target/arm-unknown-linux-musleabihf/release/einkvnc
